<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#7A1F3D" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#150109" media="(prefers-color-scheme: dark)">
<title>সেতু — মোবাইল অ্যাপ (ডেমো ইউআই)</title>
<meta name="description" content="SheTu / সেতু matrimony app — animated mobile UI prototype. HTML, CSS and vanilla JS only; every screen is dummy data and every image a generated placeholder.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237A1F3D'/%3E%3Cpath d='M20 42c0-8 24-8 24-16a8 8 0 0 0-16 0' fill='none' stroke='%23FFF0F3' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">

<!--
  Fonts come from Google when the network allows it; the stacks in tokens.css
  fall back to system serifs otherwise, so the build also works offline and on
  a first paint before the stylesheet arrives.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..500&family=Hind+Siliguri:wght@400;500;600&family=Noto+Serif+Bengali:wght@500;600;700&display=swap">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/animations.css">
<link rel="stylesheet" href="assets/css/screens.css">
</head>
<body>

<div class="stage">
  <div class="device" id="device">

    <!-- the splash, which removes itself once the first screen has drawn -->
    <div class="splash" id="splash">
      <span class="splash__ring"></span>
      <span class="splash__ring" style="animation-delay:.6s"></span>
      <div class="splash__mark" style="text-align:center">
        <svg viewBox="0 0 24 24" width="62" height="62" fill="none" stroke="currentColor"
             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="14.4" r="4.4"/><circle cx="15" cy="14.4" r="4.4"/>
          <path d="m7.4 8.6 1.6-3.2 1.6 3.2M13.4 8.6 15 5.4l1.6 3.2"/>
        </svg>
        <h1 style="color:inherit;font-size:2.2rem;margin-top:10px">সেতু</h1>
        <p style="opacity:.82;letter-spacing:.26em;font-size:.68rem;text-transform:uppercase">SheTu</p>
      </div>
    </div>

    <!-- the screen stack: the router keeps at most two layers here -->
    <div class="viewport" id="screens"></div>

    <!--
      The navigator. It lives here rather than in a screen, so every screen
      has it without drawing it, and it survives the transition between two.
    -->
    <button class="navbtn" id="navbtn" data-act="nav" aria-label="সব স্ক্রিন">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3.5" y="3.5" width="7" height="7" rx="1.6"/>
        <rect x="13.5" y="3.5" width="7" height="7" rx="1.6"/>
        <rect x="3.5" y="13.5" width="7" height="7" rx="1.6"/>
        <rect x="13.5" y="13.5" width="7" height="7" rx="1.6"/>
      </svg>
    </button>

    <!-- overlays: sheets and dialogs -->
    <div id="overlay" hidden></div>
    <!-- toasts -->
    <div class="toasts" id="toasts" aria-live="polite"></div>

  </div>
  <p class="stage-hint">এটি একটি ডেমো ইউআই · ফোনের প্রস্থে দেখলে পূর্ণ স্ক্রিন হবে</p>
</div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/ui.js"></script>
<script>window.SCREENS = {}; window.SCREEN_HOOKS = {}; window.ACTIONS = {}; window.SHEETS = {};</script>
<script src="assets/js/screens-public.js"></script>
<script src="assets/js/screens-auth.js"></script>
<script src="assets/js/screens-member.js"></script>
<script src="assets/js/screens-connect.js"></script>
<script src="assets/js/screens-family.js"></script>
<script src="assets/js/screens-admin.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
